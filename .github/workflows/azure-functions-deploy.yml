# Azure Functions へのビルドとデプロイ

name: Deploy to Azure Functions

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: azure-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: 🛎 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: 📦 Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: 🔨 Build
        run: pnpm build

      # ponytail: --config.node-linker=hoisted is required here, not optional —
      # pnpm's default symlinked node_modules doesn't survive Kudu's zip
      # extraction (a real-world failure: transitive deps like @azure/functions'
      # `cookie` resolved locally but came back "Cannot find module" once
      # deployed, because Kudu's .NET-based unzip drops the pnpm symlinks).
      - name: ✂️ Prune devDependencies
        run: pnpm install --prod --frozen-lockfile --ignore-scripts --config.node-linker=hoisted

      - name: 🚀 Deploy to Azure Functions
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: func-discord-reader-mcp
          package: .
          sku: flexconsumption
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
